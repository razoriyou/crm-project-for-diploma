[build]
  command   = "npm run build"
  publish   = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION  = "10"

# SPA fallback — all paths serve index.html so state-based routing works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-lived cache for hashed static assets (CRA adds content hashes)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
